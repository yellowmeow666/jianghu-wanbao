name: CI

on:
  pull_request:
  push:
    branches:
      - feat/mvp

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # CI 占位密钥，不是生产密钥。当前单测不写 Cookie，留给以后的 Cookie 单测。
      COOKIE_ENCRYPTION_KEY: ci-cookie-encryption-key-not-for-prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  backend-mysql:
    name: backend-mysql
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: jianghu_wanbao
          MYSQL_USER: jianghu
          MYSQL_PASSWORD: jianghu
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # job 跑在 runner 上，不在容器里。service 端口映射到宿主机 3306，
      # 所以主机名用 127.0.0.1，与本地 .env 一致。服务名 mysql 只有 job 自己也在容器内才解析得到。
      DATABASE_URL: mysql://jianghu:jianghu@127.0.0.1:3306/jianghu_wanbao
      # CI 占位令牌，不是生产密钥。
      ADMIN_TOKEN: ci-admin-token
      # CI 占位密钥，不是生产密钥。当前集成测不写 Cookie，留给以后的 Cookie 单测。
      COOKIE_ENCRYPTION_KEY: ci-cookie-encryption-key-not-for-prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run migrate
      - run: npm run test:mysql

  admin:
    name: admin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # miniprogram 使用微信开发者工具本地编译，不进入 CI，也不做部署。
